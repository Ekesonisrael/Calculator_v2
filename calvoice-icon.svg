<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <radialGradient id="bg" cx="50%" cy="-10%" r="120%">
      <stop offset="0%" stop-color="#1a2440"/>
      <stop offset="45%" stop-color="#0d1220"/>
      <stop offset="100%" stop-color="#05060a"/>
    </radialGradient>
    <linearGradient id="waveGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4F8CFF" stop-opacity="0.25"/>
      <stop offset="50%" stop-color="#4F8CFF" stop-opacity="1"/>
      <stop offset="100%" stop-color="#4F8CFF" stop-opacity="0.25"/>
    </linearGradient>
  </defs>

  <!-- squircle base -->
  <rect x="0" y="0" width="512" height="512" rx="118" ry="118" fill="url(#bg)"/>
  <rect x="0" y="0" width="512" height="512" rx="118" ry="118" fill="none" stroke="rgba(255,255,255,0.06)" stroke-width="2"/>

  <!-- grid zone: y 66 to 366, margin 70 left/right -->
  <!-- divider cross, confined strictly to the grid zone -->
  <g opacity="0.45" stroke="#3E7BFA" stroke-width="2">
    <line x1="256" y1="66" x2="256" y2="366"/>
    <line x1="70" y1="216" x2="442" y2="216"/>
  </g>

  <!-- four symbols, each centered in its quadrant, shared baseline logic via dominant-baseline -->
  <g font-family="'Segoe UI', Helvetica, Arial, sans-serif" fill="#4F8CFF" text-anchor="middle">
    <text x="163" y="141" font-size="140" font-weight="600" dominant-baseline="central">&#960;</text>
    <text x="349" y="141" font-size="112" font-weight="700" dominant-baseline="central">x!</text>
    <text x="163" y="291" font-size="122" font-weight="600" dominant-baseline="central">&#8730;</text>
    <text x="349" y="291" font-size="96"  font-weight="700" font-style="italic" dominant-baseline="central">log</text>
  </g>

  <!-- voice waveform footer, its own band below the grid, clear of every other element -->
  <g>
    <rect x="70"  y="396" width="6" height="18" rx="3" fill="url(#waveGrad)"/>
    <rect x="94"  y="384" width="6" height="42" rx="3" fill="url(#waveGrad)"/>
    <rect x="118" y="368" width="6" height="74" rx="3" fill="url(#waveGrad)"/>
    <rect x="142" y="378" width="6" height="54" rx="3" fill="url(#waveGrad)"/>
    <rect x="166" y="390" width="6" height="30" rx="3" fill="url(#waveGrad)"/>
    <rect x="190" y="374" width="6" height="62" rx="3" fill="url(#waveGrad)"/>
    <rect x="214" y="360" width="6" height="90" rx="3" fill="url(#waveGrad)"/>
    <rect x="238" y="368" width="6" height="74" rx="3" fill="url(#waveGrad)"/>
    <rect x="262" y="360" width="6" height="90" rx="3" fill="url(#waveGrad)"/>
    <rect x="286" y="374" width="6" height="62" rx="3" fill="url(#waveGrad)"/>
    <rect x="310" y="390" width="6" height="30" rx="3" fill="url(#waveGrad)"/>
    <rect x="334" y="378" width="6" height="54" rx="3" fill="url(#waveGrad)"/>
    <rect x="358" y="368" width="6" height="74" rx="3" fill="url(#waveGrad)"/>
    <rect x="382" y="384" width="6" height="42" rx="3" fill="url(#waveGrad)"/>
    <rect x="406" y="396" width="6" height="18" rx="3" fill="url(#waveGrad)"/>
  </g>
</svg>
