<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>fx-calc Pro</title>
<meta name="theme-color" content="#05060a" id="themeColorMeta">
<style>
  :root{
    --bg-a:#05060a; --bg-b:#0d1220; --bg-c:#1a2440;
    --key-num:#1c1d22; --key-num-text:#f2f2f2;
    --key-fn:#262830; --key-fn-text:#d6d6da;
    --accent:#3E7BFA; --accent-b:#1D4ED8; --accent-text:#ffffff;
    --ink:#ffffff; --ink-dim:rgba(255,255,255,0.42);
    --badge-bg:rgba(255,255,255,0.08); --badge-text:rgba(255,255,255,0.65);
    --panel:rgba(255,255,255,0.06); --panel-border:rgba(255,255,255,0.1);
    --seg-active-text:#ffffff;
    --key-sheen:rgba(255,255,255,0.10);
  }
  [data-theme="light"]{
    --bg-a:#eef0f4; --bg-b:#e4e7ee; --bg-c:#dfe6f5;
    --key-num:#ffffff; --key-num-text:#1a1a1a;
    --key-fn:#e7e9ee; --key-fn-text:#4a4a4a;
    --accent:#3E7BFA; --accent-b:#1D4ED8; --accent-text:#ffffff;
    --ink:#161616; --ink-dim:rgba(0,0,0,0.4);
    --badge-bg:rgba(0,0,0,0.06); --badge-text:rgba(0,0,0,0.55);
    --panel:rgba(0,0,0,0.04); --panel-border:rgba(0,0,0,0.08);
    --seg-active-text:#ffffff;
    --key-sheen:rgba(255,255,255,0.55);
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent; user-select:none;}
  html,body{
    margin:0; height:100%;
    background:radial-gradient(140% 100% at 50% -20%, var(--bg-c), var(--bg-b) 45%, var(--bg-a) 85%);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    overscroll-behavior:none;
    transition:background 0.25s ease;
  }
  .shell{ height:100dvh; display:flex; flex-direction:column;
    padding:calc(10px + env(safe-area-inset-top)) 14px calc(14px + env(safe-area-inset-bottom));
    gap:10px; position:relative;
  }
  .topbar{ display:grid; grid-template-columns:auto 1fr auto; align-items:center; flex-shrink:0; padding:2px 2px; gap:8px;}
  .segmented{ display:flex; background:var(--panel); border:1px solid var(--panel-border);
    border-radius:999px; padding:3px; gap:2px; justify-self:center; overflow-x:auto; max-width:100%; }
  .seg{ appearance:none; border:none; background:transparent; color:var(--ink-dim);
    font-size:11px; font-weight:700; letter-spacing:0.04em;
    padding:6px 12px; border-radius:999px; font-family:inherit; cursor:pointer; whitespace:nowrap; }
  .seg.active{ background:var(--accent); color:var(--seg-active-text); }
  .icon-btn{
    width:32px; height:32px; border-radius:50%;
    background:var(--panel); border:1px solid var(--panel-border);
    color:var(--ink-dim); display:flex; align-items:center; justify-content:center; cursor:pointer;
  }
  .icon-btn svg{ width:15px; height:15px; }
  .calc{ flex:1; min-height:0; display:flex; flex-direction:column; }
  .display{ position:relative; padding:8px 6px 14px; flex:0 0 auto;
    display:flex; flex-direction:column; justify-content:flex-end;
  }
  
  /* Floating & Movable Mic Button */
  .mic-fab{
    position:fixed; width:58px; height:58px; border-radius:50%;
    background:linear-gradient(165deg, rgba(255,255,255,0.35), transparent 55%), var(--accent);
    color:var(--accent-text); border:none;
    display:flex; align-items:center; justify-content:center;
    box-shadow:0 8px 20px rgba(37,99,235,0.45), inset 0 1px 0 rgba(255,255,255,0.3);
    z-index:40; touch-action:none; cursor:grab;
    opacity:1; transition:opacity 0.4s ease, transform 0.15s ease;
  }
  .mic-fab svg{ width:24px; height:24px; pointer-events:none; }
  .mic-fab:active{ transform:scale(0.94); cursor:grabbing; }
  .mic-fab.dragging{ transition:none; }
  .mic-fab.idle{ opacity:0.35; }
  .mic-fab.listening{ opacity:1; animation:pulse 1s infinite ease-in-out; }
  @keyframes pulse{
    0%,100%{ box-shadow:0 0 0 0 rgba(37,99,235,0.55), 0 8px 20px rgba(37,99,235,0.45); }
    50%{ box-shadow:0 0 0 12px rgba(37,99,235,0), 0 8px 20px rgba(37,99,235,0.45); }
  }

  .angle-chip{ position:absolute; top:0; right:0; padding:0 10px; height:24px; border-radius:11px;
    background:var(--badge-bg); border:none;
    display:flex; align-items:center; justify-content:center;
    color:var(--accent); font-size:10.5px; letter-spacing:0.08em; font-weight:700;
    font-family:"SFMono-Regular",Consolas,monospace; cursor:pointer;
  }
  .history-line{ font-family:"SFMono-Regular",Consolas,monospace;
    color:var(--ink-dim); font-size:clamp(13px, 3.6vw, 16px); min-height:18px; font-weight:500;
    text-align:right; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
    margin-top:18px; flex-shrink:0;
  }
  .current{ font-family:"SFMono-Regular",Consolas,monospace;
    color:var(--ink); font-size:clamp(32px, 11vw, 50px); font-weight:600;
    text-align:right; white-space:nowrap; overflow-x:auto; flex-shrink:0;
    scrollbar-width:none; outline:none;
  }
  .current::-webkit-scrollbar{ display:none; }
  .current:empty::before{ content:"0"; }

  .sci-rows{ display:grid; grid-template-columns:repeat(5, 1fr); grid-auto-rows:1fr; gap:7px;
    margin-bottom:8px; flex:0 0 auto; }
  .sci-rows.hidden{ display:none; }
  .grid{ display:grid; grid-template-columns:repeat(4, 1fr); gap:8px; flex:1; min-height:0; }
  .grid.hidden{ display:none; }
  .key{ appearance:none; border:none; cursor:pointer; border-radius:18px;
    font-size:clamp(16px, 4.5vw, 22px); font-weight:500; color:var(--key-num-text);
    background:linear-gradient(165deg, var(--key-sheen), transparent 55%), var(--key-num);
    box-shadow:0 3px 8px rgba(0,0,0,0.22), inset 0 1px 0 rgba(255,255,255,0.16);
    transition:transform 0.06s ease, filter 0.06s ease;
    display:flex; align-items:center; justify-content:center; height:100%; width:100%; padding:2px;
  }
  .key:active{ transform:scale(0.92); filter:brightness(1.15); }
  .sci-rows .key{ min-height:0; padding:4px; border-radius:14px; font-size:clamp(12px, 3.5vw, 15px); }
  .key.fn{ background:linear-gradient(165deg, var(--key-sheen), transparent 55%), var(--key-fn); color:var(--key-fn-text); }
  .key.op{ background:linear-gradient(165deg, rgba(255,255,255,0.35), transparent 55%), var(--accent); color:var(--accent-text); font-weight:700; }
  .key.eq{ background:linear-gradient(165deg, rgba(255,255,255,0.35), transparent 55%), var(--accent); color:var(--accent-text); font-weight:700; }
  .key.wide{ grid-column:span 2; }

  /* Panels (Conv & Const) */
  .panel-view{ display:flex; flex-direction:column; gap:10px; flex:1; min-height:0; padding-top:4px; }
  .panel-view.hidden{ display:none; }
  .search-input{
    font-family:inherit; font-size:14px; color:var(--ink); background:var(--panel);
    border:1px solid var(--panel-border); border-radius:12px; padding:10px 14px; outline:none;
  }
  .item-list{ overflow-y:auto; display:flex; flex-direction:column; gap:8px; flex:1; }
  .list-card{
    background:var(--panel); border:1px solid var(--panel-border); border-radius:14px;
    padding:12px 14px; display:flex; justify-content:space-between; align-items:center; cursor:pointer;
  }
  .list-card:active{ background:var(--badge-bg); }
  .list-card .title{ color:var(--ink); font-weight:600; font-size:14px; }
  .list-card .sub{ color:var(--ink-dim); font-size:12px; margin-top:2px; }
  .list-card .val{ color:var(--accent); font-family:monospace; font-weight:700; font-size:14px; }

  .conv-categories{ display:flex; gap:6px; overflow-x:auto; padding-bottom:4px; flex:0 0 auto; scrollbar-width:none; }
  .conv-categories::-webkit-scrollbar{ display:none; }
  .conv-chip{ appearance:none; border:none; cursor:pointer; flex:0 0 auto; background:var(--panel);
    border:1px solid var(--panel-border); color:var(--ink-dim); padding:8px 14px; border-radius:999px; font-size:12px; font-weight:600; }
  .conv-chip.active{ background:var(--accent); color:var(--accent-text); border-color:transparent; }
  .conv-row{ display:flex; gap:8px; align-items:center; flex:0 0 auto; }
  .conv-input, .conv-result{ flex:1; min-width:0; font-family:monospace; font-size:22px; font-weight:600;
    color:var(--ink); background:var(--panel); border:1px solid var(--panel-border); border-radius:14px; padding:12px 14px; text-align:right; }
  .conv-result{ color:var(--accent); }
  .conv-select{ flex:0 0 auto; max-width:40%; font-family:inherit; font-size:13px; font-weight:600; color:var(--ink);
    background:var(--panel); border:1px solid var(--panel-border); border-radius:14px; padding:12px 8px; }

  .toast{ position:fixed; left:50%; bottom:26px; transform:translateX(-50%); background:rgba(30,32,38,0.95);
    color:#fff; padding:9px 18px; border-radius:20px; font-size:13px; opacity:0; transition:opacity 0.2s ease;
    pointer-events:none; border:1px solid rgba(255,255,255,0.08); max-width:85vw; text-align:center; z-index:50; }
  .toast.show{ opacity:1; }

  .history-overlay{ position:fixed; inset:0; background:rgba(6,7,9,0.72); backdrop-filter:blur(4px);
    display:flex; align-items:flex-end; justify-content:center; opacity:0; pointer-events:none; transition:opacity 0.18s ease; z-index:100; }
  .history-overlay.open{ opacity:1; pointer-events:auto; }
  .history-panel{ width:100%; max-width:460px; max-height:72vh; background:var(--bg-b); border:1px solid var(--panel-border);
    border-radius:22px 22px 0 0; padding:14px 14px calc(14px + env(safe-area-inset-bottom)); display:flex; flex-direction:column; }
  .history-header{ display:flex; align-items:center; justify-content:space-between; margin-bottom:8px; }
  .history-header h3{ margin:0; font-size:14px; color:var(--ink); }
  .history-header button{ background:none; border:none; color:var(--ink-dim); font-size:12px; cursor:pointer; }
  .history-list{ overflow-y:auto; display:flex; flex-direction:column; gap:6px; }
  .history-item{ background:var(--panel); border:1px solid var(--panel-border); border-radius:14px; padding:10px 14px; text-align:right; cursor:pointer; }
  .history-item .h-expr{ color:var(--ink-dim); font-size:12px; }
  .history-item .h-result{ color:var(--ink); font-size:18px; font-weight:600; }
</style>
</head>
<body>

<div class="shell">
  <div class="topbar">
    <button class="icon-btn" id="themeBtn" aria-label="Toggle theme">
      <svg id="themeIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="4"></circle><line x1="12" y1="2" x2="12" y2="4"></line><line x1="12" y1="20" x2="12" y2="22"></line>
        <line x1="4" y1="12" x2="2" y2="12"></line><line x1="22" y1="12" x2="20" y2="12"></line>
      </svg>
    </button>
    <div class="segmented">
      <button class="seg active" id="stdModeBtn">STD</button>
      <button class="seg" id="sciModeBtn">SCI</button>
      <button class="seg" id="convModeBtn">CONV</button>
      <button class="seg" id="constModeBtn">CONST / EQ</button>
    </div>
    <button class="icon-btn" id="historyBtn" aria-label="History">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="9"></circle><polyline points="12 7 12 12 15 14"></polyline>
      </svg>
    </button>
  </div>

  <div class="calc">
    <div class="display">
      <button class="angle-chip" id="angleBtn">DEG</button>
      <div class="history-line" id="historyLine">&nbsp;</div>
      <div class="current" id="current" contenteditable="true" inputmode="none" spellcheck="false"></div>
    </div>

    <!-- Scientific Keypad -->
    <div class="sci-rows hidden" id="sciRows">
      <button class="key fn" data-act="sin">sin</button>
      <button class="key fn" data-act="cos">cos</button>
      <button class="key fn" data-act="tan">tan</button>
      <button class="key fn" data-act="log">log</button>
      <button class="key fn" data-act="logBase">log_b</button>

      <button class="key fn" data-act="ln">ln</button>
      <button class="key fn" data-act="sqrt">&#8730;x</button>
      <button class="key fn" data-act="sq">x&sup2;</button>
      <button class="key fn" data-act="recip">x&#8315;&#185;</button>
      <button class="key fn" data-act="pow">x^y</button>

      <button class="key fn" data-num="(">(</button>
      <button class="key fn" data-num=")">)</button>
      <button class="key fn" data-act="ncr">nCr</button>
      <button class="key fn" data-act="npr">nPr</button>
      <button class="key fn" data-act="s2d">S&#8660;D</button>
    </div>

    <!-- Standard Keypad -->
    <div class="grid" id="mainGrid">
      <button class="key fn" data-act="clear">AC</button>
      <button class="key fn" data-act="back">DEL</button>
      <button class="key fn" data-act="percent">%</button>
      <button class="key op" data-op="/">&divide;</button>

      <button class="key" data-num="7">7</button>
      <button class="key" data-num="8">8</button>
      <button class="key" data-num="9">9</button>
      <button class="key op" data-op="*">&times;</button>

      <button class="key" data-num="4">4</button>
      <button class="key" data-num="5">5</button>
      <button class="key" data-num="6">6</button>
      <button class="key op" data-op="-">&minus;</button>

      <button class="key" data-num="1">1</button>
      <button class="key" data-num="2">2</button>
      <button class="key" data-num="3">3</button>
      <button class="key op" data-op="+">+</button>

      <button class="key" data-num=".">.</button>
      <button class="key" data-num="0">0</button>
      <button class="key eq wide" data-act="equals">=</button>
    </div>

    <!-- Conversion View -->
    <div class="panel-view hidden" id="convPanel">
      <div class="conv-categories" id="convCategories"></div>
      <div class="conv-row">
        <input type="text" inputmode="decimal" class="conv-input" id="convFromInput" value="1">
        <select class="conv-select" id="convFromUnit"></select>
      </div>
      <div style="text-align:center;">
        <button class="icon-btn" id="convSwapBtn" style="margin:auto;">&#8645;</button>
      </div>
      <div class="conv-row">
        <div class="conv-result" id="convResult">1</div>
        <select class="conv-select" id="convToUnit"></select>
      </div>
    </div>

    <!-- Constants & Equations View -->
    <div class="panel-view hidden" id="constPanel">
      <input type="text" class="search-input" id="constSearch" placeholder="Search constants or equations (e.g., gravity, speed of light)...">
      <div class="item-list" id="constList"></div>
    </div>
  </div>
</div>

<!-- History Overlay -->
<div class="history-overlay" id="historyOverlay">
  <div class="history-panel">
    <div class="history-header">
      <h3>Calculation History</h3>
      <div>
        <button id="clearHistoryBtn">Clear</button>
        <button id="closeHistoryBtn" style="margin-left:8px;">Close</button>
      </div>
    </div>
    <div class="history-list" id="historyList"></div>
  </div>
</div>

<!-- Floating Movable Mic FAB -->
<button class="mic-fab" id="micBtn" aria-label="Voice input">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
    <path d="M12 15a3 3 0 0 0 3-3V6a3 3 0 0 0-6 0v6a3 3 0 0 0 3 3z"></path>
    <path d="M19 11a7 7 0 0 1-14 0"></path>
    <line x1="12" y1="19" x2="12" y2="22"></line>
  </svg>
</button>

<div class="toast" id="toast"></div>

<script>
let expr = "";
let lastResult = null;
let angleMode = "deg";
let showingFraction = false;
let justEvaluated = false;
let history = [];
let pendingInsertAt = null;

try{ history = JSON.parse(localStorage.getItem("fx-calc-history") || "[]"); } catch(e){}
function saveHistory(){ try{ localStorage.setItem("fx-calc-history", JSON.stringify(history)); }catch(e){} }

// UI Elements
const currentEl = document.getElementById("current");
const historyLine = document.getElementById("historyLine");
const angleBtn = document.getElementById("angleBtn");
const toastEl = document.getElementById("toast");
const sciRows = document.getElementById("sciRows");
const mainGrid = document.getElementById("mainGrid");
const convPanel = document.getElementById("convPanel");
const constPanel = document.getElementById("constPanel");
const micBtn = document.getElementById("micBtn");

// Floating Draggable Mic FAB Logic (Starts near standard +/- area, draggable anywhere)
(function setupDraggableMic(){
  let isDragging = false, moved = false, startX, startY, startLeft, startTop;

  // Set initial position centered between grid rows
  const setInitialPos = () => {
    const saved = JSON.parse(localStorage.getItem("fx-calc-mic-pos") || "null");
    if (saved && typeof saved.top === "number") {
      micBtn.style.top = saved.top + "px";
      micBtn.style.left = saved.left + "px";
    } else {
      micBtn.style.top = (window.innerHeight * 0.45) + "px";
      micBtn.style.left = (window.innerWidth - 74) + "px";
    }
  };
  setInitialPos();

  micBtn.addEventListener("pointerdown", (e)=>{
    isDragging = true; moved = false;
    startX = e.clientX; startY = e.clientY;
    const r = micBtn.getBoundingClientRect();
    startLeft = r.left; startTop = r.top;
    micBtn.classList.add("dragging");
    micBtn.setPointerCapture(e.pointerId);
  });

  micBtn.addEventListener("pointermove", (e)=>{
    if (!isDragging) return;
    const dx = e.clientX - startX, dy = e.clientY - startY;
    if (Math.abs(dx) > 5 || Math.abs(dy) > 5) moved = true;
    if (!moved) return;
    const maxLeft = window.innerWidth - 64;
    const maxTop = window.innerHeight - 64;
    micBtn.style.left = Math.min(Math.max(6, startLeft + dx), maxLeft) + "px";
    micBtn.style.top = Math.min(Math.max(6, startTop + dy), maxTop) + "px";
  });

  micBtn.addEventListener("pointerup", ()=>{
    isDragging = false;
    micBtn.classList.remove("dragging");
    if (moved){
      localStorage.setItem("fx-calc-mic-pos", JSON.stringify({
        left: parseFloat(micBtn.style.left),
        top: parseFloat(micBtn.style.top)
      }));
    }
  });

  let idleTimer;
  const resetIdle = () => {
    micBtn.classList.remove("idle");
    clearTimeout(idleTimer);
    idleTimer = setTimeout(()=> micBtn.classList.add("idle"), 4000);
  };
  window.addEventListener("pointerdown", resetIdle);
  resetIdle();

  window.__micWasDragged = () => moved;
})();

function updateDisplay(){
  currentEl.textContent = expr;
  currentEl.scrollLeft = currentEl.scrollWidth;
}

function insertDigit(d){
  if (justEvaluated){ expr=""; justEvaluated=false; }
  expr += d;
  updateDisplay();
}

function insertAtCaret(str){
  expr += str;
  updateDisplay();
}

function setDisplay(text){
  expr = text;
  updateDisplay();
}

function toast(msg){
  toastEl.textContent = msg;
  toastEl.classList.add("show");
  clearTimeout(toast._t);
  toast._t = setTimeout(()=> toastEl.classList.remove("show"), 2000);
}

// Scientific & Physics Constants Database
const SCIENCE_DATA = [
  { name: "Speed of Light (c)", val: "299792458", sub: "m/s — Physics" },
  { name: "Standard Gravity (g)", val: "9.80665", sub: "m/s² — Physics" },
  { name: "Planck Constant (h)", val: "6.62607015e-34", sub: "J·s — Quantum" },
  { name: "Avogadro Number (Na)", val: "6.02214076e23", sub: "mol⁻¹ — Chemistry" },
  { name: "Universal Gas Constant (R)", val: "8.314462618", sub: "J/(mol·K) — Thermodynamics" },
  { name: "Vacuum Permittivity (ε₀)", val: "8.8541878128e-12", sub: "F/m — Electromagnetism" },
  { name: "Vacuum Permeability (μ₀)", val: "1.25663706212e-6", sub: "N/A² — Electromagnetism" },
  { name: "Electron Mass (me)", val: "9.1093837015e-31", sub: "kg — Particle Physics" },
  { name: "Boltzmann Constant (kB)", val: "1.380649e-23", sub: "J/K — Statistical Mechanics" },
  { name: "Kinetic Energy Eq.", val: "0.5*m*v^2", sub: "Formula: Ek = 1/2 m v²" },
  { name: "Ohm's Law (Voltage)", val: "I*R", sub: "Formula: V = I × R" },
  { name: "Gravitational Force Eq.", val: "G*(m1*m2)/r^2", sub: "Formula: F = G(m1 m2)/r²" }
];

const constListEl = document.getElementById("constList");
const constSearchEl = document.getElementById("constSearch");
